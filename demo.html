<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Demo v11 · Caja real + Premios por mes</title>
<style>
:root{--verde:#1a4a3a;--verde2:#14564a;--fondo:#f2f5f7}
*{box-sizing:border-box;font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--fondo);color:#111}
header{background:var(--verde);color:#fff;padding:14px 16px;display:flex;align-items:center;gap:10px;position:sticky;top:0;z-index:10}
.back{width:38px;height:38px;border-radius:50%;background:#fff;color:var(--verde);display:flex;align-items:center;justify-content:center;font-size:18px;border:0}
header h1{font-size:17px;margin:0;flex:1}
.card{background:#fff;margin:10px 12px;border-radius:16px;padding:14px;box-shadow:0 1px 4px rgba(0,0,0,.06)}
.card h2{font-size:11px;margin:0 0 10px;text-transform:uppercase;letter-spacing:.5px;color:#8a94a0;display:flex;justify-content:space-between;align-items:center}
.verde{background:var(--verde);color:#fff;margin:10px 12px;border-radius:16px;padding:16px;box-shadow:0 2px 8px rgba(0,0,0,.15)}
.verde .r1{display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px;text-align:center}
.verde .cell{border:0;background:transparent;color:#fff;padding:4px;border-radius:12px}
.verde .cell b{font-size:17px;display:block}
.verde .cell small{font-size:9px;opacity:.8;text-transform:uppercase;font-weight:700}
.verde .cell.toc{background:rgba(255,255,255,.12)}
.verde .r2{display:grid;grid-template-columns:1fr 1fr;gap:6px;text-align:center;margin-top:12px;padding-top:12px;border-top:1px solid rgba(255,255,255,.2)}
.verde .r2 b{font-size:14px;display:block}
.verde .r2 small{font-size:9px;opacity:.8;text-transform:uppercase;font-weight:700}
.verde .amar{color:#f5d76e}
.verde .claro{color:#9fe3c0}
.hdr{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
.chipHist{background:#e8f3ee;color:var(--verde2);font-size:10px;font-weight:800;border-radius:8px;padding:4px 8px}
.fila{display:flex;justify-content:space-between;align-items:center;padding:10px 2px;border-bottom:1px solid #eef1f4}
.fila:last-child{border-bottom:0}
.fila .n{display:flex;align-items:center;gap:8px;font-weight:700;font-size:14px}
.dot{width:8px;height:8px;border-radius:50%}
.fila .m{font-weight:800;color:var(--verde2);font-size:14px}
input[type=date],select{border:1px solid #d7dce2;border-radius:12px;padding:9px 10px;font-size:13px;background:#fff;width:100%}
.btn{width:100%;border:0;border-radius:14px;padding:14px;font-weight:800;font-size:14px}
.btn.p{background:var(--verde);color:#fff}
.btn.s{background:#e8f3ee;color:var(--verde);border:2px solid var(--verde);margin-top:8px}
.dia{background:#f2f5f7;border-radius:14px;margin-bottom:8px;overflow:hidden}
.dia .hd{display:flex;justify-content:space-between;align-items:center;padding:12px;font-weight:800;font-size:14px;border:0;background:transparent;width:100%;text-align:left}
.dia .hd small{color:#8a94a0;font-weight:700}
.dia .bd{padding:0 12px 12px}
.dia .row{display:flex;justify-content:space-between;padding:8px 0;border-top:1px solid #e3e8ee;font-size:13px}
.dia .row b{color:var(--verde2)}
.totalRow{display:flex;justify-content:space-between;align-items:center;background:#e8f3ee;border-radius:12px;padding:12px;margin-bottom:10px}
.totalRow small{color:#8a94a0;font-weight:700;font-size:10px;text-transform:uppercase}
.totalRow b{color:var(--verde2);font-size:18px}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.5);display:none;align-items:flex-end;justify-content:center;z-index:50}
.modal.open{display:flex}
.sheet{background:#fff;width:100%;max-width:420px;border-radius:20px 20px 0 0;padding:16px;padding-bottom:calc(16px + env(safe-area-inset-bottom))}
.sheet .t{font-weight:800;font-size:16px;margin-bottom:10px}
.sheet .tot{background:#e8f3ee;border-radius:14px;padding:14px;text-align:center;margin:12px 0}
.sheet .tot b{font-size:24px;color:var(--verde2)}
.sheet .tot small{display:block;color:#8a94a0;font-size:10px;font-weight:700;text-transform:uppercase}
.screen{display:none}.screen.on{display:block}
#toast{position:fixed;left:50%;bottom:30px;transform:translateX(-50%);background:#14564a;color:#fff;padding:10px 18px;border-radius:99px;font-size:13px;opacity:0;transition:opacity .3s;pointer-events:none;z-index:60}
</style>
</head>
<body>

<!-- PANTALLA 1: CAJA -->
<div id="s1" class="screen on">
<header><button class="back">←</button><h1>Caja del día</h1></header>

<div class="verde">
<div class="r1">
<button class="cell toc" id="abreRango"><b id="vHoy">—</b><small>Vendido hoy · toca rango</small></button>
<div class="cell"><b id="pHoy">—</b><small>Premios pagados</small></div>
<div class="cell"><b class="claro" id="gHoy">—</b><small>Ganancia</small></div>
</div>
<div class="r2">
<div><b id="coHoy">—</b><small>Contado</small></div>
<div><b class="amar" id="crHoy">—</b><small>Crédito hoy</small></div>
</div>
</div>

<div class="card">
<div class="hdr"><h2 style="margin:0">Por sorteo</h2><span class="chipHist" id="hist">Total histórico: —</span></div>
<input type="date" id="fechaSorteo" value="2026-08-14">
<div id="breakdown" style="margin-top:8px"></div>
</div>

<button class="btn p" style="margin:10px 12px;width:calc(100% - 24px)" id="pagarPremio">Pagar premio</button>
<button class="btn s" style="margin:0 12px;width:calc(100% - 24px)" id="verMeses">Premios pagados por mes</button>
</div>

<!-- PANTALLA 2: PREMIOS POR MES -->
<div id="s2" class="screen">
<header><button class="back" id="v2">←</button><h1>Premios pagados</h1></header>
<div class="card">
<select id="mesSel"></select>
<div style="height:10px"></div>
<div class="totalRow"><small>Total del mes</small><b id="totMes">—</b></div>
<div id="dias"></div>
</div>
</div>

<!-- HOJITA RANGO DE FECHAS -->
<div class="modal" id="sheetRango">
<div class="sheet">
<div class="t">Vendido por rango de fechas</div>
<input type="date" id="desde" value="2026-08-08" style="margin-bottom:8px">
<input type="date" id="hasta" value="2026-08-14">
<div class="tot"><small>Total vendido en el rango</small><b id="totRango">—</b></div>
<button class="btn p" id="cierraRango">Listo</button>
</div>
</div>

<div id="toast"></div>
<script>
const HOY='2026-08-14';
const ventas=[
 {f:'2026-08-14',s:'Mañana',m:4765},{f:'2026-08-14',s:'Tarde',m:4595},{f:'2026-08-14',s:'Noche',m:2155},
 {f:'2026-08-13',s:'Mañana',m:3200},{f:'2026-08-13',s:'Tarde',m:2800},{f:'2026-08-13',s:'Noche',m:1500},
 {f:'2026-08-12',s:'Mañana',m:2500},{f:'2026-08-12',s:'Tarde',m:2100},
 {f:'2026-08-08',s:'Mañana',m:1800},{f:'2026-08-08',s:'Tarde',m:1600},{f:'2026-08-08',s:'Noche',m:900},
 {f:'2026-07-26',s:'Noche',m:1200}
];
const premios=[
 {f:'2026-08-14',s:'Noche',num:'19',nom:'Mariposa',m:5200},
 {f:'2026-08-13',s:'Mañana',num:'10',nom:'Anillo',m:90},{f:'2026-08-13',s:'Tarde',num:'11',nom:'Perro',m:100},
 {f:'2026-08-08',s:'Mañana',num:'19',nom:'Mariposa',m:80},{f:'2026-08-08',s:'Tarde',num:'10',nom:'Anillo',m:90},{f:'2026-08-08',s:'Noche',num:'11',nom:'Perro',m:100},
 {f:'2026-07-26',s:'Noche',num:'10',nom:'Anillo',m:50}
];
const $=id=>document.getElementById(id);
const fmt=n=>'L '+n.toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2});
function toast(m){const t=$('toast');t.textContent=m;t.style.opacity=1;setTimeout(()=>t.style.opacity=0,1800);}
function go(n){document.querySelectorAll('.screen').forEach(s=>s.classList.remove('on'));$('s'+n).classList.add('on');window.scrollTo(0,0);}
const sum=(arr)=>arr.reduce((a,x)=>a+x.m,0);
const DOT={Mañana:'#f2c744',Tarde:'#7ea2f2',Noche:'#48c774'};

function pintarCaja(){
 $('vHoy').textContent=fmt(sum(ventas.filter(v=>v.f===HOY)));
 $('pHoy').textContent=fmt(sum(premios.filter(p=>p.f===HOY)));
 $('gHoy').textContent=fmt(sum(ventas.filter(v=>v.f===HOY))-sum(premios.filter(p=>p.f===HOY)));
 $('coHoy').textContent=fmt(1790);$('crHoy').textContent=fmt(9725);
 $('hist').textContent='Total histórico: '+fmt(sum(ventas));
 pintarBreakdown();
}
function pintarBreakdown(){
 const f=$('fechaSorteo').value;
 const bd=$('breakdown');bd.innerHTML='';
 ['Mañana','Tarde','Noche'].forEach(s=>{
  const m=sum(ventas.filter(v=>v.f===f&&v.s===s));
  bd.innerHTML+='<div class="fila"><span class="n"><span class="dot" style="background:'+(DOT[s]||'#ccc')+'"></span>'+s+'</span><span class="m">'+fmt(m)+'</span></div>';
 });
 bd.innerHTML+='<div class="fila"><span class="n">Total del día</span><span class="m">'+fmt(sum(ventas.filter(v=>v.f===f)))+'</span></div>';
}
function rangoTotal(){
 const d=$('desde').value,h=$('hasta').value;
 $('totRango').textContent=fmt(sum(ventas.filter(v=>v.f>=d&&v.f<=h)));
}
function pintarMeses(){
 const meses=[...new Set(premios.map(p=>p.f.slice(0,7)))].sort().reverse();
 const MESES=['Enero','Febrero','Marzo','Abril','Mayo','Junio','Julio','Agosto','Septiembre','Octubre','Noviembre','Diciembre'];
 $('mesSel').innerHTML=meses.map(m=>'<option value="'+m+'">'+MESES[parseInt(m.slice(5),10)-1]+' '+m.slice(0,4)+'</option>').join('');
 $('mesSel').onchange=pintarDias;
 pintarDias();
}
function pintarDias(){
 const mes=$('mesSel').value;
 const delMes=premios.filter(p=>p.f.startsWith(mes));
 $('totMes').textContent=fmt(sum(delMes));
 const fechas=[...new Set(delMes.map(p=>p.f))].sort().reverse();
 const c=$('dias');c.innerHTML='';
 fechas.forEach(f=>{
  const delDia=delMes.filter(p=>p.f===f);
  const d=document.createElement('div');
  d.className='dia';
  d.innerHTML='<button class="hd"><span>'+f.slice(8,10)+'/'+f.slice(5,7)+'/'+f.slice(2,4)+'</span><small>'+fmt(sum(delDia))+' ▾</small></button><div class="bd" style="display:none"></div>';
  const bd=d.querySelector('.bd');
  delDia.forEach(p=>{bd.innerHTML+='<div class="row"><span>'+p.s+' · '+p.num+' '+p.nom+'</span><b>'+fmt(p.m)+'</b></div>';});
  d.querySelector('.hd').onclick=()=>{bd.style.display=bd.style.display==='none'?'block':'none';};
  c.appendChild(d);
 });
 if(!fechas.length)c.innerHTML='<p style="color:#98a2ae;font-size:13px;text-align:center;padding:10px">Sin premios ese mes.</p>';
}
$('abreRango').onclick=()=>{rangoTotal();$('sheetRango').classList.add('open');};
$('desde').oninput=rangoTotal;$('hasta').oninput=rangoTotal;
$('cierraRango').onclick=()=>$('sheetRango').classList.remove('open');
$('fechaSorteo').onchange=pintarBreakdown;
$('pagarPremio').onclick=()=>toast('Pagar premio (igual que hoy)');
$('verMeses').onclick=()=>{pintarMeses();go(2);};
$('v2').onclick=()=>go(1);
pintarCaja();
</script>
</body>
</html>
