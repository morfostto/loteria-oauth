<script>
  document.getElementById('btnJuegos').onclick = () => document.getElementById('menuJuegos').classList.toggle('hidden');
  const grid = document.getElementById('grid');
  const enCarrito = [45,78,12];
  const seleccionado = [33];
  for (let n = 0; n < 100; n++) {
    const num = String(n).padStart(2,'0');
    const b = document.createElement('button');
    b.textContent = num;
    let cls = 'rounded-lg flex items-center justify-center font-bold ';
    if (seleccionado.includes(n)) cls += 'bg-[#1a4a3a] text-white shadow-md text-sm';
    else if (enCarrito.includes(n)) cls += 'bg-emerald-100 text-[#1a4a3a] text-sm';
    else cls += 'bg-white border border-slate-200 text-slate-800 text-sm';
    b.className = cls;
    grid.appendChild(b);
  }
</script>
