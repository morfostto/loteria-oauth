<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Preview Nueva Venta</title>
<script src="https://cdn.tailwindcss.com"></script>
<style>html,body{height:100%}</style>
</head>
<body class="bg-slate-300">
<div class="max-w-md mx-auto h-screen flex flex-col bg-[#f5f7f9] overflow-hidden">

  <div class="flex items-center justify-between px-5 pt-2 pb-1 bg-white text-slate-900 text-xs font-bold"><span>11:16</span><span>📶 🔋 57</span></div>

  <div class="bg-white px-4 pb-3 shadow-sm">
    <div class="flex items-center gap-3 pt-1">
      <button class="w-10 h-10 rounded-full bg-white shadow flex items-center justify-center text-[#1a4a3a] text-xl">←</button>
      <h1 class="text-lg font-bold text-slate-900 flex-1">Nueva Venta</h1>
      <button class="w-10 h-10 rounded-full bg-white shadow flex items-center justify-center">💾</button>
      <button class="w-10 h-10 rounded-full bg-white shadow flex items-center justify-center text-[#1a4a3a]">🗃️</button>
    </div>
    <div class="flex gap-2 mt-3">
      <div class="flex-1 bg-slate-50 rounded-xl px-3 py-2.5 text-sm font-semibold flex justify-between items-center">18/08/2026 <span class="text-gray-400">⌄</span></div>
      <div class="flex-1 bg-slate-50 rounded-xl px-3 py-2.5 text-sm font-semibold flex justify-between items-center">Tarde <span class="text-gray-400">⌄</span></div>
    </div>
  </div>

  <div class="px-4 pt-2 flex gap-2 overflow-x-auto flex-shrink-0">
    <div class="flex-shrink-0 bg-white rounded-xl px-3 py-1.5 shadow-sm flex items-center gap-2 border-2 border-[#1a4a3a]"><span class="text-sm font-extrabold text-slate-900">45</span><span class="text-[10px] text-gray-400">L 20</span><span class="text-red-400 text-xs font-bold">✕</span></div>
    <div class="flex-shrink-0 bg-white rounded-xl px-3 py-1.5 shadow-sm flex items-center gap-2 border-2 border-[#1a4a3a]"><span class="text-sm font-extrabold text-slate-900">78</span><span class="text-[10px] text-gray-400">L 20</span><span class="text-red-400 text-xs font-bold">✕</span></div>
    <div class="flex-shrink-0 bg-white rounded-xl px-3 py-1.5 shadow-sm flex items-center gap-2 border-2 border-[#1a4a3a]"><span class="text-sm font-extrabold text-slate-900">12</span><span class="text-[10px] text-gray-400">L 50</span><span class="text-red-400 text-xs font-bold">✕</span></div>
  </div>

  <div class="mx-4 mt-2 mb-2 bg-white rounded-2xl p-2.5 shadow-sm flex-1 flex flex-col min-h-0">
    <div class="flex justify-between px-1 pb-1.5"><span class="text-gray-400 text-[10px] font-bold uppercase tracking-wide">Tablero · La Diaria</span><span class="text-[#1a4a3a] text-[10px] font-bold">3 jugadas</span></div>
    <div id="grid" class="grid grid-cols-10 gap-1 flex-1 auto-rows-fr"></div>
  </div>

  <div class="px-4 pb-2 flex gap-2 overflow-x-auto flex-shrink-0">
    <button class="flex-shrink-0 border-2 border-[#1a4a3a] bg-emerald-50 rounded-xl px-3 py-1.5 flex items-center gap-2"><span class="w-6 h-6 bg-white rounded-md flex items-center justify-center text-[#1a4a3a]">◎</span><span class="text-xs font-bold text-gray-800">La Diaria <span class="text-[#1a4a3a]">· Variable</span></span></button>
    <button class="flex-shrink-0 border-2 border-transparent bg-white rounded-xl px-3 py-1.5 flex items-center gap-2 shadow-sm"><span class="w-6 h-6 bg-slate-100 rounded-md flex items-center justify-center text-gray-500">🎫</span><span class="text-xs font-bold text-gray-500">Pares/Nones</span></button>
  </div>

  <div class="bg-white px-4 pt-2.5 pb-3 shadow-[0_-4px_20px_rgba(0,0,0,0.08)] flex-shrink-0">
    <div class="bg-slate-50 rounded-xl px-3 py-2 text-sm text-gray-400 flex justify-between items-center">👤 Cliente <span>⌄</span></div>
    <div class="flex items-center justify-between mt-2">
      <div><p class="text-gray-400 text-[11px]">3 jugada(s)</p><p class="text-[#1a4a3a] text-xl font-extrabold leading-tight">L 90.00</p></div>
      <button class="bg-[#1a4a3a] text-white px-6 py-3 rounded-2xl font-bold text-sm">🎫 FACTURAR</button>
    </div>
  </div>

  <div class="bg-white border-t border-slate-100 flex py-2 text-[11px] font-semibold text-gray-400 flex-shrink-0">
    <div class="flex-1 text-center">🏠 Inicio</div>
    <div class="flex-1 text-center text-[#1a4a3a] font-bold">＋ Nueva Venta</div>
    <div class="flex-1 text-center">👥 Clientes</div>
    <div class="flex-1 text-center">••• Más</div>
  </div>

</div>
<script>
  const grid = document.getElementById('grid');
  const enCarrito = [45,78,12];
  const seleccionado = [33];
  for (let n = 0; n < 100; n++) {
    const num = String(n).padStart(2,'0');
    const b = document.createElement('button');
    b.textContent = num;
    let cls = 'rounded-md flex items-center justify-center text-[13px] font-extrabold ';
    if (seleccionado.includes(n)) cls += 'bg-[#1a4a3a] text-white shadow-md';
    else if (enCarrito.includes(n)) cls += 'bg-emerald-100 text-[#1a4a3a]';
    else cls += 'bg-slate-100 text-slate-700';
    b.className = cls;
    grid.appendChild(b);
  }
</script>
</body>
</html>
