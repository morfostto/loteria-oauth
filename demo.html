<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>MI LOTERÍA · Nueva venta (prototipo v4)</title>
<style>
:root{
  --primary:#14564A; --on-primary:#FFFFFF;
  --primary-container:#A7F3D0; --primary-soft:#D9EFE8;
  --surface:#F7FBF8; --surface-container:#EDF3EF; --surface-high:#E7EFEB;
  --on-surface:#191C1B; --on-var:#5C6664; --outline:#6B7975;
  --line:#E6EEE9; --error:#BA1A1A; --error-container:#FDECEA;
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden}
body{font-family:Roboto,-apple-system,'Segoe UI',system-ui,sans-serif;background:var(--surface-high);display:flex;justify-content:center;color:var(--on-surface)}
svg{display:block}
.app{width:100%;max-width:430px;height:100dvh;display:flex;flex-direction:column;background:var(--surface);overflow:hidden;position:relative}
header{flex-shrink:0;padding:calc(8px + env(safe-area-inset-top)) 12px 8px}
.hrow{display:flex;align-items:center;gap:10px}
.back{width:40px;height:40px;border-radius:20px;border:none;background:var(--surface-container);color:var(--primary);display:flex;align-items:center;justify-content:center;cursor:pointer;flex-shrink:0}
.titles{flex:1;min-width:0}
.titles h1{font-size:17px;font-weight:700;line-height:1.15}
.titles p{font-size:11px;color:var(--on-var);line-height:1.2}
.hicons{display:flex;gap:8px}
.hicon{width:40px;height:40px;border-radius:14px;border:none;background:var(--surface-container);color:var(--primary);display:flex;align-items:center;justify-content:center;cursor:pointer;position:relative;flex-shrink:0}
.hicon:active{transform:scale(.94)}
.badge{position:absolute;top:-4px;right:-4px;min-width:16px;height:16px;padding:0 4px;border-radius:9px;background:var(--primary);color:#fff;font-size:9px;font-weight:800;display:flex;align-items:center;justify-content:center}
.selrow{display:flex;gap:8px;margin-top:8px}
.dateinp{flex:1;background:#fff;border:1px solid var(--line);border-radius:12px;padding:9px 12px;font-size:13px;font-weight:600;color:var(--on-surface);font-family:inherit;outline:none;min-width:0}
.sorteobtn{flex:1;background:#fff;border:1px solid var(--line);border-radius:12px;padding:9px 12px;font-size:13px;font-weight:600;color:var(--on-surface);display:flex;align-items:center;justify-content:space-between;gap:6px;cursor:pointer;font-family:inherit;min-width:0}
.dot{width:8px;height:8px;border-radius:50%;background:#22C55E;box-shadow:0 0 6px #22C55E88;flex-shrink:0}
.display{margin:6px 12px 6px;background:#fff;border:1px solid var(--line);border-radius:16px;padding:10px 14px;display:flex;align-items:center;gap:12px;min-height:58px;flex-shrink:0}
.num-big{min-width:60px;text-align:center;background:var(--primary-soft);color:var(--primary);border-radius:14px;font-size:25px;font-weight:800;padding:5px 10px;letter-spacing:.5px;font-variant-numeric:tabular-nums}
.disp-info{flex:1;min-width:0}
.disp-name{font-size:15px;font-weight:700}
.disp-sub{font-size:11px;color:var(--on-var);margin-top:2px}
.main{flex:1;min-height:0;display:flex;gap:10px;padding:0 12px 6px}
.ticket{flex:1;min-width:0;background:#fff;border:1px solid var(--line);border-radius:16px;display:flex;flex-direction:column;overflow:hidden}
.ticket-head{padding:7px 10px;font-size:9px;font-weight:800;letter-spacing:.5px;text-transform:uppercase;color:var(--on-var);background:var(--surface-container);display:flex;justify-content:space-between;gap:6px;flex-shrink:0}
.ticket-list{flex:1;overflow-y:auto;padding:2px 8px;scrollbar-width:none}
.ticket-list::-webkit-scrollbar{display:none}
/* --- líneas del recibo: limpias, y al tocarlas aparecen las opciones detrás --- */
.trow{display:flex;align-items:center;gap:8px;padding:10px 2px;border-bottom:1px dashed #DCE7E2;cursor:pointer}
.trow:last-child{border-bottom:none}
.trow:active{background:var(--surface-container)}
.tnum{flex:1;min-width:0;font-size:14px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--on-surface)}
.tpre{font-size:14px;font-weight:800;color:var(--primary);font-variant-numeric:tabular-nums;flex-shrink:0}
.tdots{color:#C9D3CF;font-size:15px;font-weight:800;flex-shrink:0;margin-left:2px}
.tact{display:flex;gap:6px;width:100%;align-items:center}
.tbtn2{border:none;border-radius:10px;padding:9px 6px;font-size:12px;font-weight:800;display:flex;align-items:center;justify-content:center;gap:5px;cursor:pointer;font-family:inherit}
.tbtn2.edit{flex:1;background:var(--surface-container);color:var(--primary)}
.tbtn2.del{flex:1;background:var(--error-container);color:var(--error)}
.tbtn2.close{flex:0 0 32px;background:transparent;color:var(--on-var);font-size:13px}
.ein{background:#fff;border:1px solid var(--primary);border-radius:10px;padding:8px;font-size:13px;font-weight:700;outline:none;font-family:inherit;color:var(--on-surface)}
.ein.nums{flex:1;min-width:0}
.ein.precio{width:74px;flex-shrink:0}
.tbtn{width:30px;height:30px;border-radius:10px;border:none;display:flex;align-items:center;justify-content:center;cursor:pointer;flex-shrink:0}
.tbtn.ok{background:var(--primary);color:#fff}
.tbtn.cancel{background:var(--surface-container);color:var(--on-var)}
.empty{color:var(--on-var);font-size:11px;padding:12px 4px;text-align:center;line-height:1.6}
.ticket-foot{padding:8px 10px;border-top:1px dashed #DCE7E2;display:flex;justify-content:space-between;font-size:13.5px;font-weight:800;flex-shrink:0}
.ticket-foot span:last-child{color:var(--primary);font-variant-numeric:tabular-nums}
.pad{flex:1.05;min-width:0;display:grid;grid-template-columns:repeat(3,1fr);grid-template-rows:repeat(4,1fr);gap:8px}
.key{background:#fff;border:1px solid var(--line);border-radius:16px;font-size:20px;font-weight:700;color:var(--on-surface);display:flex;align-items:center;justify-content:center;cursor:pointer;font-family:inherit;min-height:0}
.key:active{transform:scale(.95);background:var(--primary-soft)}
.key.fn{color:var(--on-var)}
.key.danger{color:var(--error)}
.amounts{flex-shrink:0;display:flex;gap:8px;align-items:center;overflow-x:auto;padding:0 12px 6px;scrollbar-width:none}
.amounts::-webkit-scrollbar{display:none}
.amt{flex-shrink:0;background:var(--primary-soft);color:var(--primary);font-size:13px;font-weight:800;border:none;border-radius:12px;padding:10px 14px;cursor:pointer;font-family:inherit}
.amt:active{transform:scale(.94)}
.amt.off{opacity:.45}
.otro{width:74px;flex-shrink:0;padding:10px;border-radius:12px;border:1px solid var(--line);font-size:13px;font-family:inherit;outline:none;background:#fff}
.clientrow{flex-shrink:0;display:flex;gap:8px;align-items:center;padding:0 12px 6px}
.clientpill{flex:1;min-width:0;display:flex;align-items:center;gap:8px;background:var(--surface-container);border:none;border-radius:12px;padding:11px 12px;font-size:13px;font-weight:600;color:var(--on-var);cursor:pointer;font-family:inherit;text-align:left}
.clientpill.on{color:var(--on-surface)}
.clientpill .cname{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pago{display:flex;border-radius:12px;overflow:hidden;background:var(--surface-container);flex-shrink:0}
.pago button{border:none;padding:11px 13px;font-size:12px;font-weight:800;background:transparent;color:var(--on-var);cursor:pointer;font-family:inherit}
.pago button.on{background:var(--primary);color:#fff}
.facturar{flex-shrink:0;margin:0 12px 8px;height:52px;border:none;border-radius:26px;background:var(--primary);color:#fff;font-size:16px;font-weight:800;display:flex;align-items:center;justify-content:center;gap:10px;cursor:pointer;font-family:inherit;box-shadow:0 6px 18px rgba(20,86,74,.28);font-variant-numeric:tabular-nums}
.facturar:active{transform:scale(.98)}
.facturar:disabled{background:#DDE5E1;color:#9AA8A2;box-shadow:none}
.nav{flex-shrink:0;background:#fff;border-top:1px solid #EDF1EE;display:flex;padding:6px 0 calc(8px + env(safe-area-inset-bottom))}
.nav button{flex:1;border:none;background:none;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11px;font-weight:600;color:var(--on-var);cursor:pointer;font-family:inherit}
.nav .pill{height:28px;padding:0 16px;border-radius:20px;display:flex;align-items:center;justify-content:center}
.nav button.on{color:var(--primary);font-weight:800}
.nav button.on .pill{background:var(--primary-soft)}
.toast{position:fixed;top:16px;left:50%;transform:translateX(-50%) translateY(-90px);background:var(--primary);color:#fff;border-radius:20px;padding:10px 18px;font-size:13px;font-weight:700;z-index:99;transition:transform .3s;white-space:nowrap;box-shadow:0 8px 24px rgba(0,0,0,.25)}
.toast.show{transform:translateX(-50%) translateY(0)}
</style>
</head>
<body>
<div class="app">
  <header>
    <div class="hrow">
      <button class="back"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5M12 19l-7-7 7-7"/></svg></button>
      <div class="titles"><h1>Nueva venta</h1><p>Selecciona tus números</p></div>
      <div class="hicons">
        <button class="hicon" title="Tipo de jugada"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="4"/><circle cx="12" cy="12" r="1" fill="currentColor" stroke="none"/></svg></button>
        <button class="hicon" title="Guardar en pausa"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"/><polyline points="17 21 17 13 7 13 7 21"/><polyline points="7 3 7 8 15 8"/></svg></button>
        <button class="hicon" title="Tickets en pausa"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="5" rx="1"/><path d="M5 8v11a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8"/><line x1="10" y1="12" x2="14" y2="12"/></svg><span class="badge">2</span></button>
      </div>
    </div>
    <div class="selrow">
      <input type="date" class="dateinp" value="2026-09-11">
      <button class="sorteobtn"><span>Mañana</span><span style="display:flex;align-items:center;gap:6px"><span class="dot"></span><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 12 15 18 9"/></svg></span></button>
    </div>
  </header>

  <div class="display" id="display"></div>

  <div class="main">
    <div class="ticket">
      <div class="ticket-head"><span id="ticketCount">0 jugada(s)</span><span>Ticket en vivo</span></div>
      <div class="ticket-list" id="ticketList"></div>
      <div class="ticket-foot"><span>TOTAL</span><span id="ticketTotal">L 0.00</span></div>
    </div>
    <div class="pad">
      <button class="key" onclick="tecla('1')">1</button><button class="key" onclick="tecla('2')">2</button><button class="key" onclick="tecla('3')">3</button>
      <button class="key" onclick="tecla('4')">4</button><button class="key" onclick="tecla('5')">5</button><button class="key" onclick="tecla('6')">6</button>
      <button class="key" onclick="tecla('7')">7</button><button class="key" onclick="tecla('8')">8</button><button class="key" onclick="tecla('9')">9</button>
      <button class="key danger fn" onclick="borrar()">C</button><button class="key" onclick="tecla('0')">0</button>
      <button class="key fn" onclick="retro()"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 5H9l-6 7 6 7h12a1 1 0 0 0 1-1V6a1 1 0 0 0-1-1z"/><line x1="18" y1="9" x2="12" y2="15"/><line x1="12" y1="9" x2="18" y2="15"/></svg></button>
    </div>
  </div>

  <div class="amounts" id="amounts"></div>

  <div class="clientrow">
    <button class="clientpill" id="clientPill" onclick="toggleCliente()"></button>
    <div class="pago" id="pagoSeg" style="display:none">
      <button id="pagoContado" onclick="setPago('contado')">Contado</button>
      <button id="pagoCredito" onclick="setPago('credito')">Crédito</button>
    </div>
  </div>

  <button class="facturar" id="facturarBtn" onclick="facturar()"></button>

  <div class="nav">
    <button><span class="pill"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 10.5 12 3l9 7.5"/><path d="M5 9.5V21h14V9.5"/></svg></span>Inicio</button>
    <button class="on"><span class="pill"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg></span>Vender</button>
    <button><span class="pill"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17 21v-2a4 4 0 0 0-4-4H7a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg></span>Clientes</button>
    <button><span class="pill"><svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><circle cx="5" cy="12" r="1.8"/><circle cx="12" cy="12" r="1.8"/><circle cx="19" cy="12" r="1.8"/></svg></span>Más</button>
  </div>
</div>
<div class="toast" id="toast"></div>

<script>
const NOMBRES=['Avión','Pies','Mujer','Muerto','Tigre','Embarazada','Elefante','Navaja','Conejo','Hombre','Anillo','Perro','Caballo','Gato','Boda','Ratón','Niña','Joven','Ángel','Mariposa','Espejo','Pájaro','Ataúd','Mono','Sapo','Balanza','Bandera','Juego','Gallo','Padre','Bolo','Alacrán','Culebra','Carpintero','Música','Virgen','Viejita','Suerte','Pistola','Jabón','Cielo','Novia','Madre','Pantera','Mesas','Iglesia','Familia','Banco','Estrella','Sombra','Luna Nueva','Policía','Zorrillo','Llanta','Licor','Olas','Árbol','Cuchillo','Venado','Selva','Dragón','Guerra','Lagarto','Coco','Mueble','Pintura','Diablo','Vaca','Ladrón','Soldado','Oro','Zapatos','Arco','Fuego','Edificio','Reina','Palomas','Humo','Tienda','Flores','Café','Rieles','Escuela','Bote','Corona','Casa','Reloj','León','Platos','Búho','Lentes','Tortuga','Águila','Cartero','Carro','Costurera','Dinero','Viejito','Bailes','Aretes'];
const LAPIZ='<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17 3a2.8 2.8 0 1 1 4 4L7.5 20.5 2 22l1.5-5.5Z"/></svg>';
const BASURA='<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18"/><path d="M8 6V4a1 1 0 0 1 1-1h6a1 1 0 0 1 1 1v2"/><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/></svg>';
const CHECK='<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>';
const XMARK='<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>';
let cur='', numFijo=null, clienteOn=false, pago='contado';
let rowMode={};               // id de línea -> 'acciones' | 'edit'
let editVals={nums:'',precio:''};
// Semilla de demo para que veas las líneas limpias de inmediato
let ticket=[
  {id:'d1',nums:['11'],precio:80},
  {id:'d2',nums:['34'],precio:20},
  {id:'d3',nums:['78'],precio:50},
];
const $=s=>document.querySelector(s);
const nombre=n=>NOMBRES[parseInt(n,10)]||'';
const formatL=n=>'L '+n.toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2});
const total=()=>ticket.reduce((s,t)=>s+t.precio,0);
function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),1800);}
/* ---- flujo de 2 pasos: número -> monto -> recibo ---- */
function tecla(d){ if(cur.length>=2)return; cur+=d; if(cur.length===2){ numFijo=cur; cur=''; } render(); }
function retro(){ if(cur) cur=cur.slice(0,-1); else numFijo=null; render(); }
function borrar(){ cur=''; numFijo=null; render(); }
function ponMonto(v){ if(numFijo){ ticket.push({id:Date.now()+''+Math.random(),nums:[numFijo],precio:v}); numFijo=null; render(); } }
function ponOtro(){ const v=parseFloat(($('#otro')||{}).value); if(numFijo&&v>0){ ticket.push({id:Date.now()+''+Math.random(),nums:[numFijo],precio:v}); numFijo=null; render(); } }
/* ---- líneas del recibo: tocar -> opciones detrás ---- */
function toggleAcciones(id){ rowMode = rowMode[id] ? {} : {[id]:'acciones'}; render(); }
function cerrarModos(){ rowMode={}; render(); }
function iniciarEdicion(id){ const t=ticket.find(x=>x.id===id); if(!t)return; editVals={nums:t.nums.join(','),precio:String(t.precio)}; rowMode={[id]:'edit'}; render(); }
function guardarEdicion(id){
  const nums=editVals.nums.split(',').map(s=>s.trim()).filter(Boolean).map(n=>n.padStart(2,'0'));
  const precio=parseFloat(editVals.precio);
  if(!nums.length||!(precio>0)){ toast('Revisa el número y el monto'); return; }
  const t=ticket.find(x=>x.id===id); if(t){ t.nums=nums; t.precio=precio; }
  rowMode={}; render();
}
function eliminarLinea(id){ ticket=ticket.filter(x=>x.id!==id); rowMode={}; render(); }
function toggleCliente(){ clienteOn=!clienteOn; if(!clienteOn) pago='contado'; render(); }
function setPago(p){ pago=p; render(); }
function facturar(){ if(!ticket.length)return; toast('✓ Facturado '+formatL(total())+' · demo'); ticket=[]; numFijo=null; cur=''; rowMode={}; render(); }
function render(){
  const d=$('#display');
  if(numFijo){ d.innerHTML='<div class="num-big">'+numFijo+'</div><div class="disp-info"><div class="disp-name">'+numFijo+' '+nombre(numFijo)+'</div><div class="disp-sub">Elige el monto abajo y queda en el recibo</div></div>'; }
  else if(cur){ d.innerHTML='<div class="num-big">'+cur+'</div><div class="disp-info"><div class="disp-name">escribiendo…</div><div class="disp-sub">La Diaria · Números y Símbolos</div></div>'; }
  else { d.innerHTML='<div class="disp-info"><div class="disp-name" style="color:var(--on-var);font-weight:600">Elige el número</div><div class="disp-sub">La Diaria · Números y Símbolos</div></div>'; }
  const tl=$('#ticketList');
  tl.innerHTML = ticket.length ? ticket.map(t=>{
    const m=rowMode[t.id];
    if(m==='edit'){
      return '<div class="trow">'
        +'<input class="ein nums" value="'+editVals.nums+'" oninput="editVals.nums=this.value" placeholder="número(s)">'
        +'<input class="ein precio" type="number" value="'+editVals.precio+'" oninput="editVals.precio=this.value">'
        +'<button class="tbtn ok" onclick="guardarEdicion(\''+t.id+'\')">'+CHECK+'</button>'
        +'<button class="tbtn cancel" onclick="cerrarModos()">'+XMARK+'</button>'
        +'</div>';
    }
    if(m==='acciones'){
      return '<div class="trow"><div class="tact">'
        +'<button class="tbtn2 edit" onclick="iniciarEdicion(\''+t.id+'\')">'+LAPIZ+' Editar</button>'
        +'<button class="tbtn2 del" onclick="eliminarLinea(\''+t.id+'\')">'+BASURA+' Eliminar</button>'
        +'<button class="tbtn2 close" onclick="cerrarModos()">'+XMARK+'</button>'
        +'</div></div>';
    }
    return '<div class="trow" onclick="toggleAcciones(\''+t.id+'\')">'
      +'<span class="tnum">'+t.nums.map(n=>n+' '+nombre(n)).join(', ')+'</span>'
      +'<span class="tpre">'+formatL(t.precio)+'</span>'
      +'<span class="tdots">⋮</span>'
      +'</div>';
  }).join('') : '<div class="empty">El recibo aparecerá aquí.<br>Toca cualquier línea para editar o eliminar.</div>';
  tl.scrollTop=tl.scrollHeight;
  $('#ticketCount').textContent=tic
