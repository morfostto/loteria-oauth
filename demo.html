<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>MI LOTERÍA · Nueva venta (prototipo v2)</title>
<style>
:root{
  --primary:#14564A; --on-primary:#FFFFFF;
  --primary-container:#A7F3D0; --primary-soft:#D9EFE8;
  --surface:#F7FBF8; --surface-container:#EDF3EF; --surface-high:#E7EFEB;
  --on-surface:#191C1B; --on-surface-var:#5C6664; --outline:#6B7975;
  --line:#E6EEE9; --error:#BA1A1A; --error-container:#FDECEA;
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden}
body{font-family:Roboto,-apple-system,'Segoe UI',system-ui,sans-serif;background:var(--surface-high);display:flex;justify-content:center;color:var(--on-surface)}
svg{display:block}
.app{width:100%;max-width:430px;height:100dvh;display:flex;flex-direction:column;background:var(--surface);overflow:hidden;position:relative}
/* ---------- HEADER ---------- */
header{flex-shrink:0;padding:calc(10px + env(safe-area-inset-top)) 12px 8px;background:var(--surface)}
.hrow{display:flex;align-items:center;gap:10px}
.back{width:40px;height:40px;border-radius:20px;border:none;background:var(--surface-container);color:var(--primary);display:flex;align-items:center;justify-content:center;cursor:pointer;flex-shrink:0}
.titles{flex:1;min-width:0}
.titles h1{font-size:17px;font-weight:700;line-height:1.15}
.titles p{font-size:11px;color:var(--on-surface-var);line-height:1.2}
.hicons{display:flex;gap:8px}
.hicon{width:40px;height:40px;border-radius:14px;border:none;background:var(--surface-container);color:var(--primary);display:flex;align-items:center;justify-content:center;cursor:pointer;position:relative;flex-shrink:0}
.hicon:active{transform:scale(.94)}
.badge{position:absolute;top:-4px;right:-4px;min-width:16px;height:16px;padding:0 4px;border-radius:9px;background:var(--primary);color:#fff;font-size:9px;font-weight:800;display:flex;align-items:center;justify-content:center}
.selrow{display:flex;gap:8px;margin-top:9px}
.dateinp{flex:1;background:#fff;border:1px solid var(--line);border-radius:12px;padding:9px 12px;font-size:13px;font-weight:600;color:var(--on-surface);font-family:inherit;outline:none}
.sorteobtn{flex:1;background:#fff;border:1px solid var(--line);border-radius:12px;padding:9px 12px;font-size:13px;font-weight:600;color:var(--on-surface);display:flex;align-items:center;justify-content:space-between;gap:6px;cursor:pointer;font-family:inherit}
.dot{width:8px;height:8px;border-radius:50%;background:#22C55E;box-shadow:0 0 6px #22C55E88;flex-shrink:0}
/* ---------- VISOR DEL NÚMERO ESCRITO ---------- */
.display{margin:6px 12px 8px;background:#fff;border:1px solid var(--line);border-radius:16px;padding:10px 14px;display:flex;align-items:center;gap:12px;min-height:60px;flex-shrink:0}
.num-big{min-width:62px;text-align:center;background:var(--primary-soft);color:var(--primary);border-radius:14px;font-size:26px;font-weight:800;padding:6px 10px;letter-spacing:.5px;font-variant-numeric:tabular-nums}
.disp-info{flex:1;min-width:0}
.disp-name{font-size:15px;font-weight:700}
.disp-sub{font-size:11px;color:var(--on-surface-var);margin-top:2px}
.tokens{display:flex;gap:6px;flex-wrap:wrap}
.token{background:var(--primary-soft);color:var(--primary);font-weight:700;border-radius:10px;padding:3px 9px;font-size:13px}
/* ---------- ZONA CENTRAL: TECLADO + TICKET ---------- */
.main{flex:1;min-height:0;display:flex;gap:10px;padding:0 12px 8px}
.pad{flex:1.05;min-width:0;display:grid;grid-template-columns:repeat(3,1fr);grid-template-rows:repeat(4,1fr);gap:8px}
.key{background:#fff;border:1px solid var(--line);border-radius:16px;font-size:20px;font-weight:700;color:var(--on-surface);display:flex;align-items:center;justify-content:center;cursor:pointer;font-family:inherit;min-height:0}
.key:active{transform:scale(.95);background:var(--primary-soft)}
.key.fn{color:var(--on-surface-var)}
.key.danger{color:var(--error)}
.ticket{flex:1;min-width:0;background:#fff;border:1px solid var(--line);border-radius:16px;display:flex;flex-direction:column;overflow:hidden}
.ticket-head{padding:8px 12px;font-size:10px;font-weight:800;letter-spacing:.5px;text-transform:uppercase;color:var(--on-surface-var);background:var(--surface-container);display:flex;justify-content:space-between;flex-shrink:0}
.ticket-list{flex:1;overflow-y:auto;padding:2px 10px;scrollbar-width:none}
.ticket-list::-webkit-scrollbar{display:none}
.trow{display:flex;align-items:center;gap:6px;padding:8px 0;border-bottom:1px dashed #DCE7E2}
.trow:last-child{border-bottom:none}
.tnum{flex:1;min-width:0;font-size:13px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tpre{font-size:13px;font-weight:800;color:var(--primary);font-variant-numeric:tabular-nums;flex-shrink:0}
.tx{width:24px;height:24px;border-radius:8px;border:none;background:var(--error-container);color:var(--error);display:flex;align-items:center;justify-content:center;cursor:pointer;flex-shrink:0}
.ticket-foot{padding:9px 12px;border-top:1px dashed #DCE7E2;display:flex;justify-content:space-between;font-size:14px;font-weight:800;flex-shrink:0}
.ticket-foot span:last-child{color:var(--primary);font-variant-numeric:tabular-nums}
.empty{color:var(--on-surface-var);font-size:11px;padding:12px 4px;text-align:center;line-height:1.5}
/* ---------- MONTOS ---------- */
.amounts{flex-shrink:0;display:flex;gap:8px;align-items:center;overflow-x:auto;padding:0 12px 8px;scrollbar-width:none}
.amounts::-webkit-scrollbar{display:none}
.amt{flex-shrink:0;background:var(--primary-soft);color:var(--primary);font-size:13px;font-weight:800;border:none;border-radius:12px;padding:10px 14px;cursor:pointer;font-family:inherit}
.amt:active{transform:scale(.94)}
.amt.off{opacity:.45}
.otro{width:76px;flex-shrink:0;padding:10px;border-radius:12px;border:1px solid var(--line);font-size:13px;font-family:inherit;outline:none;background:#fff}
.fixednote{font-size:11px;font-weight:600;color:var(--on-surface-var);white-space:nowrap}
/* ---------- CLIENTE / PAGO ---------- */
.clientrow{flex-shrink:0;display:flex;gap:8px;align-items:center;padding:0 12px 8px}
.clientpill{flex:1;min-width:0;display:flex;align-items:center;gap:8px;background:var(--surface-container);border:none;border-radius:12px;padding:11px 12px;font-size:13px;font-weight:600;color:var(--on-surface-var);cursor:pointer;font-family:inherit;text-align:left}
.clientpill.on{color:var(--on-surface)}
.clientpill .cname{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pago{display:flex;border-radius:12px;overflow:hidden;background:var(--surface-container);flex-shrink:0}
.pago button{border:none;padding:11px 13px;font-size:12px;font-weight:800;background:transparent;color:var(--on-surface-var);cursor:pointer;font-family:inherit}
.pago button.on{background:var(--primary);color:#fff}
/* ---------- FACTURAR ---------- */
.facturar{flex-shrink:0;margin:2px 12px 10px;height:54px;border:none;border-radius:28px;background:var(--primary);color:#fff;font-size:16px;font-weight:800;display:flex;align-items:center;justify-content:center;gap:10px;cursor:pointer;font-family:inherit;box-shadow:0 6px 18px rgba(20,86,74,.28);font-variant-numeric:tabular-nums}
.facturar:active{transform:scale(.98)}
.facturar:disabled{background:#DDE5E1;color:#9AA8A2;box-shadow:none}
/* ---------- NAV ---------- */
.nav{flex-shrink:0;background:#fff;border-top:1px solid #EDF1EE;display:flex;padding:6px 0 calc(8px + env(safe-area-inset-bottom))}
.nav button{flex:1;border:none;background:none;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11px;font-weight:600;color:var(--on-surface-var);cursor:pointer;font-family:inherit}
.nav .pill{height:28px;padding:0 16px;border-radius:20px;display:flex;align-items:center;justify-content:center}
.nav button.on{color:var(--primary);font-weight:800}
.nav button.on .pill{background:var(--primary-soft)}
/* ---------- MENÚS / SHEETS / TOAST ---------- */
.menu{position:absolute;right:12px;top:96px;width:224px;background:#fff;border:1px solid var(--line);border-radius:16px;box-shadow:0 10px 30px rgba(0,0,0,.14);padding:6px;z-index:40}
.mitem{display:flex;align-items:center;gap:9px;width:100%;padding:10px 12px;border:none;border-radius:12px;background:none;text-align:left;cursor:pointer;font-family:inherit}
.mitem.on{background:var(--primary-soft)}
.mitem .mi{width:28px;height:28px;border-radius:9px;background:var(--surface-container);color:var(--primary);display:flex;align-items:center;justify-content:center;flex-shrink:0}
.mitem.on .mi{background:#fff}
.mitem .mt{flex:1;min-width:0}
.mitem .mt b{display:block;font-size:12px;color:var(--on-surface)}
.mitem .mt span{display:block;font-size:10px;font-weight:600;color:var(--on-surface-var)}
.sheet{position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:50;display:flex;align-items:flex-end;justify-content:center}
.sheet-in{background:#fff;width:100%;max-width:430px;border-radius:24px 24px 0 0;padding:14px 14px calc(16px + env(safe-area-inset-bottom))}
.sheet-in h3{font-size:15px;font-weight:700;margin:4px 0 8px}
.sitem{display:flex;align-items:center;justify-content:space-between;width:100%;padding:13px 4px;border:none;border-bottom:1px solid #F0F4F1;background:none;font-size:14px;font-weight:600;color:var(--on-surface);cursor:pointer;font-family:inherit}
.chipstate{font-size:10px;font-weight:800;padding:3px 8px;border-radius:8px}
.chipstate.ab{background:var(--primary-soft);color:var(--primary)}
.chipstate.px{background:#E3EDFB;color:#2563EB}
.toast{position:fixed;top:16px;left:50%;transform:translateX(-50%) translateY(-90px);background:var(--primary);color:#fff;border-radius:20px;padding:10px 18px;font-size:13px;font-weight:700;z-index:99;transition:transform .3s;white-space:nowrap;box-shadow:0 8px 24px rgba(0,0,0,.25)}
.toast.show{transform:translateX(-50%) translateY(0)}
.hidden{display:none}
</style>
</head>
<body>
<div class="app">
  <header>
    <div class="hrow">
      <button class="back"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5M12 19l-7-7 7-7"/></svg></button>
      <div class="titles"><h1>Nueva venta</h1><p>Selecciona tus números</p></div>
      <div class="hicons">
        <button class="hicon" id="btnJugadas" title="Tipo de jugada"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="4"/><circle cx="12" cy="12" r="1" fill="currentColor" stroke="none"/></svg></button>
        <button class="hicon" id="btnSave" title="Guardar en pausa"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"/><polyline points="17 21 17 13 7 13 7 21"/><polyline points="7 3 7 8 15 8"/></svg></button>
        <button class="hicon" id="btnArch" title="Tickets en pausa"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="5" rx="1"/><path d="M5 8v11a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8"/><line x1="10" y1="12" x2="14" y2="12"/></svg><span class="badge">2</span></button>
      </div>
    </div>
    <div class="selrow">
      <input type="date" class="dateinp" id="fecha" value="2026-09-11">
      <button class="sorteobtn" id="btnSorteo"><span id="sorteoLabel">Mañana</span><span style="display:flex;align-items:center;gap:6px"><span class="dot"></span><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 12 15 18 9"/></svg></span></button>
    </div>
  </header>

  <div class="menu hidden" id="menuJugadas"></div>

  <div class="display" id="display"></div>

  <div class="main">
    <div class="pad">
      <button class="key" onclick="tecla('1')">1</button><button class="key" onclick="tecla('2')">2</button><button class="key" onclick="tecla('3')">3</button>
      <button class="key" onclick="tecla('4')">4</button><button class="key" onclick="tecla('5')">5</button><button class="key" onclick="tecla('6')">6</button>
      <button class="key" onclick="tecla('7')">7</button><button class="key" onclick="tecla('8')">8</button><button class="key" onclick="tecla('9')">9</button>
      <button class="key danger fn" onclick="borrar()">C</button><button class="key" onclick="tecla('0')">0</button>
      <button class="key fn" onclick="retro()"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 5H9l-6 7 6 7h12a1 1 0 0 0 1-1V6a1 1 0 0 0-1-1z"/><line x1="18" y1="9" x2="12" y2="15"/><line x1="12" y1="9" x2="18" y2="15"/></svg></button>
    </div>
    <div class="ticket">
      <div class="ticket-head"><span id="ticketCount">0 jugada(s)</span><span>Ticket en vivo</span></div>
      <div class="ticket-list" id="ticketList"></div>
      <div class="ticket-foot"><span>TOTAL</span><span id="ticketTotal">L 0.00</span></div>
    </div>
  </div>

  <div class="amounts" id="amounts"></div>

  <div class="clientrow">
    <button class="clientpill" id="clientPill" onclick="toggleCliente()"></button>
    <div class="pago hidden" id="pagoSeg">
      <button id="pagoContado" onclick="setPago('contado')">Contado</button>
      <button id="pagoCredito" onclick="setPago('credito')">Crédito</button>
    </div>
  </div>

  <button class="facturar" id="facturarBtn" onclick="facturar()"></button>

  <div class="nav">
    <button><span class="pill"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 10.5 12 3l9 7.5"/><path d="M5 9.5V21h14V9.5"/></svg></span>Inicio</button>
    <button class="on"><span class="pill"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg></span>Vender</button>
    <button><span class="pill"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17 21v-2a4 4 0 0 0-4-4H7a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg></span>Clientes</button>
    <button><span class="pill"><svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><circle cx="5" cy="12" r="1.8"/><circle cx="12" cy="12" r="1.8"/><circle cx="19" cy="12" r="1.8"/></svg></span>Más</button>
  </div>

  <div class="sheet hidden" id="sheetSorteo" onclick="cerrarSorteo(event)">
    <div class="sheet-in" onclick="event.stopPropagation()">
      <h3>Elegir sorteo</h3>
      <div id="sorteoList"></div>
    </div>
  </div>
</div>
<div class="toast" id="toast"></div>

<script>
const NOMBRES=['Avión','Pies','Mujer','Muerto','Tigre','Embarazada','Elefante','Navaja','Conejo','Hombre','Anillo','Perro','Caballo','Gato','Boda','Ratón','Niña','Joven','Ángel','Mariposa','Espejo','Pájaro','Ataúd','Mono','Sapo','Balanza','Bandera','Juego','Gallo','Padre','Bolo','Alacrán','Culebra','Carpintero','Música','Virgen','Viejita','Suerte','Pistola','Jabón','Cielo','Novia','Madre','Pantera','Mesas','Iglesia','Familia','Banco','Estrella','Sombra','Luna Nueva','Policía','Zorrillo','Llanta','Licor','Olas','Árbol','Cuchillo','Venado','Selva','Dragón','Guerra','Lagarto','Coco','Mueble','Pintura','Diablo','Vaca','Ladrón','Soldado','Oro','Zapatos','Arco','Fuego','Edificio','Reina','Palomas','Humo','Tienda','Flores','Café','Rieles','Escuela','Bote','Corona','Casa','Reloj','León','Platos','Búho','Lentes','Tortuga','Águila','Cartero','Carro','Costurera','Dinero','Viejito','Bailes','Aretes'];
const JUGADAS=[
 {id:'trad',nombre:'La Diaria',req:1,pool:100,modo:'manual',fijo:5,sug:[10,20,50,80,100]},
 {id:'pega3',nombre:'Pega 3',req:3,pool:100,modo:'fijo',fijo:10},
 {id:'loto',nombre:'Loto',req:6,pool:100,modo:'fijo',fijo:10},
 {id:'bingo',nombre:'Bingo',req:5,pool:75,modo:'fijo',fijo:20}
];
const SORTEOS=[{id:'m',nombre:'Mañana',st:'ab'},{id:'t',nombre:'Tarde',st:'ab'},{id:'n',nombre:'Noche',st:'px'}];
const IX='<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>';
let mode=JUGADAS[0], cur='', sel=[], numFijo=null, ticket=[], clienteOn=false, pago='contado', sorteoId='m';
const $=s=>document.querySelector(s);
const nombre=n=>NOMBRES[parseInt(n,10)]||'';
const formatL=n=>'L '+n.toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2});
const total=()=>ticket.reduce((s,t)=>s+t.precio,0);
function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),1800);}
function tecla(d){
  if(cur.length>=2)return;
  cur+=d;
  if(cur.length===2){
    const n=parseInt(cur,10);
    const ok=mode.pool===100?n<=99:(n>=1&&n<=mode.pool);
    if(!ok){toast('Número fuera del rango de '+mode.nombre);cur='';render();return;}
    commit(cur);cur='';
  }
  render();
}
function commit(s){
  if(mode.modo==='manual'){numFijo=s;}
  else{sel.push(s);if(sel.length>=mode.req){ticket.push({nums:sel.slice(),precio:mode.fijo});sel=[];}}
}
function retro(){if(cur)cur=cur.slice(0,-1);else if(mode.modo==='manual')numFijo=null;else sel.pop();render();}
function borrar(){cur='';sel=[];numFijo=null;render();}
function ponMonto(v){if(numFijo){ticket.push({nums:[numFijo],precio:v});numFijo=null;render();}}
function ponOtro(){const v=parseFloat(($('#otro')||{}).value);if(numFijo&&v>0){ticket.push({nums:[numFijo],precio:v});numFijo=null;render();}}
function quitar(i){ticket.splice(i,1);render();}
function toggleCliente(){clienteOn=!clienteOn;if(!clienteOn)pago='contado';render();}
function setPago(p){pago=p;render();}
function facturar(){if(!ticket.length)return;toast('✓ Facturado '+formatL(total())+' · demo');ticket=[];numFijo=null;sel=[];cur='';render();}
function pickJugada(id){mode=JUGADAS.find(j=>j.id===id);cur='';sel=[];numFijo=null;$('#menuJugadas').classList.add('hidden');render();}
function pickSorteo(id){sorteoId=id;$('#sheetSorteo').classList.add('hidden');render();}
function cerrarSorteo(e){if(e.target.id==='sheetSorteo')$('#sheetSorteo').classList.add('hidden');}
function render(){
  // visor
  const d=$('#display');
  if(numFijo){d.innerHTML='<div class="num-big">'+numFijo+'</div><div class="disp-info"><div class="disp-name">'+numFijo+' '+nombre(numFijo)+'</div><div class="disp-sub">'+mode.nombre+' · elige el monto abajo y queda en el ticket</div></div>';}
  else if(sel.length){d.innerHTML='<div class="disp-info"><div class="tokens">'+sel.map(s=>'<span class="token">'+s+' '+nombre(s)+'</span>').join('')+'</div><div class="disp-sub">'+mode.nombre+' · '+sel.length+'/'+mode.req+' · precio fijo '+formatL(mode.fijo)+' · se agrega solo al completar</div></div>';}
  else if(cur){d.innerHTML='<div class="num-big">'+cur+'</div><div class="disp-info"><div class="disp-name">escribiendo…</div><div class="disp-sub">un dígito más para fijar el número</div></div>';}
  else{d.innerHTML='<div class="disp-info"><div class="disp-name" style="color:var(--on-surface-var);font-weight:600">Escribe el número en el teclado</div><div class="disp-sub">'+mode.nombre+' · el número y su animalito aparecen aquí</div></div>';}
  // ticket con auto-scroll (se ven los últimos, los demás suben)
  const tl=$('#ticketList');
  tl.innerHTML=ticket.length?ticket.map((t,i)=>'<div class="trow"><span class="tnum">'+t.nums.map(n=>n+' '+nombre(n)).join(', ')+'</span><span class="tpre">'
