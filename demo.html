<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>MI LOTERÍA · Nueva venta (prototipo)</title>
<style>
:root{
  --primary:#14564A; --on-primary:#fff;
  --primary-container:#A7F3D0; --primary-soft:#D9EFE8;
  --surface:#F7FBF8; --surface-container:#EDF3EF; --card:#fff;
  --outline:#6B7975; --text:#1B2420; --muted:#6B7480;
  --amber:#F6ECCF; --amber-text:#8A6D1A; --danger:#D93025;
  --shadow:0 2px 10px rgba(20,86,74,.08);
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{font-family:-apple-system,'Segoe UI',Roboto,sans-serif;background:#E7EFEB;color:var(--text);display:flex;justify-content:center}
.app{width:100%;max-width:430px;min-height:100vh;background:var(--surface);display:flex;flex-direction:column;position:relative;box-shadow:0 0 40px rgba(0,0,0,.12);padding-bottom:126px}
header{position:sticky;top:0;background:var(--surface);z-index:20;padding:14px 14px 8px;display:flex;align-items:center;gap:10px}
.back{width:38px;height:38px;border-radius:999px;background:#fff;border:0;box-shadow:var(--shadow);font-size:17px;cursor:pointer}
.titles{flex:1}
.titles h1{font-size:17px;font-weight:800}
.titles p{font-size:11px;color:var(--muted)}
.hicon{width:38px;height:38px;border-radius:12px;background:#fff;border:0;box-shadow:var(--shadow);cursor:pointer;position:relative;font-size:15px}
.badge{position:absolute;top:-4px;right:-4px;background:var(--primary);color:#fff;font-size:9px;font-weight:800;border-radius:999px;padding:1px 5px}
.sorteos{display:flex;gap:6px;padding:6px 14px}
.sorteo{flex:1;border:0;border-radius:12px;padding:10px 4px;background:#fff;box-shadow:var(--shadow);font-size:13px;font-weight:700;color:var(--muted);cursor:pointer;display:flex;align-items:center;justify-content:center;gap:6px}
.sorteo.on{background:var(--primary);color:#fff}
.dot{width:7px;height:7px;border-radius:999px;background:#5BE49B;box-shadow:0 0 6px #5BE49B}
.jugadas,.hot,.amounts{display:flex;gap:8px;overflow-x:auto;padding:6px 14px;scrollbar-width:none;align-items:center}
.jugadas::-webkit-scrollbar,.hot::-webkit-scrollbar,.amounts::-webkit-scrollbar,.ticket-body::-webkit-scrollbar{display:none}
.chip-j{flex-shrink:0;border:1px solid #E1E8E4;background:#fff;border-radius:999px;padding:8px 14px;font-size:13px;font-weight:700;color:var(--muted);cursor:pointer}
.chip-j.on{background:var(--primary);border-color:var(--primary);color:#fff}
.hot-label{padding:8px 14px 0;font-size:10px;font-weight:800;letter-spacing:.5px;color:var(--muted);text-transform:uppercase;display:flex;justify-content:space-between}
.chip-hot{flex-shrink:0;border:0;background:var(--amber);color:var(--amber-text);border-radius:999px;padding:10px 14px;font-size:14px;font-weight:800;cursor:pointer;box-shadow:var(--shadow)}
.chip-hot small{font-weight:600;opacity:.75;margin-left:4px}
.chip-hot:active{transform:scale(.95)}
.display{margin:4px 14px 6px;background:var(--card);border-radius:16px;box-shadow:var(--shadow);padding:10px 14px;display:flex;align-items:center;gap:12px;min-height:64px}
.num-big{min-width:74px;text-align:center;background:var(--primary-soft);color:var(--primary);border-radius:14px;font-size:30px;font-weight:800;padding:4px 10px;letter-spacing:1px}
.disp-info{flex:1;min-width:0}
.disp-name{font-size:15px;font-weight:700}
.disp-sub{font-size:11px;color:var(--muted);margin-top:2px}
.tokens{display:flex;gap:6px;flex-wrap:wrap}
.token{background:var(--primary-soft);color:var(--primary);font-weight:800;border-radius:10px;padding:4px 9px;font-size:14px}
.ticket{margin:0 14px 8px;background:#fff;border-radius:16px;box-shadow:var(--shadow);overflow:hidden}
.ticket-head{display:flex;justify-content:space-between;padding:8px 12px;background:var(--surface-container);font-size:10px;font-weight:800;color:var(--muted);text-transform:uppercase;letter-spacing:.4px}
.ticket-body{max-height:104px;overflow-y:auto;padding:2px 12px;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:13px}
.trow{display:flex;align-items:center;gap:8px;padding:7px 0;border-bottom:1px dashed #E3E8E5}
.tnum{flex:1;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tpre{font-weight:700;color:var(--primary)}
.tx{border:0;background:#FDECEA;color:var(--danger);width:22px;height:22px;border-radius:8px;font-size:14px;line-height:1;cursor:pointer;flex-shrink:0}
.ticket-foot{display:flex;justify-content:space-between;padding:9px 12px;border-top:1px dashed #E3E8E5;font-weight:800;font-size:14px}
.empty{color:#B9C4BF;font-size:12px;padding:12px 0;text-align:center}
.amt{padding:10px 14px;border-radius:999px;border:0;background:var(--amber);color:var(--amber-text);font-weight:800;font-size:13px;cursor:pointer;flex-shrink:0}
.amt.off{opacity:.4}
.amt:active{transform:scale(.95)}
.otro{width:84px;padding:10px;border-radius:999px;border:1px solid #E1E8E4;font-size:13px;outline:none;flex-shrink:0}
.pad{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:2px 14px 8px}
.key{height:50px;border:0;border-radius:14px;background:#fff;box-shadow:var(--shadow);font-size:20px;font-weight:700;color:var(--text);cursor:pointer}
.key:active{transform:scale(.96);background:var(--primary-soft)}
.key.fn{color:var(--muted);font-size:15px;font-weight:800}
.key.danger{color:var(--danger)}
.cliente-row{display:flex;gap:8px;padding:0 14px 10px;align-items:center}
.cliente-pill{flex:1;display:flex;align-items:center;gap:8px;background:#fff;border:0;border-radius:999px;padding:11px 14px;box-shadow:var(--shadow);font-size:14px;font-weight:600;color:var(--muted);cursor:pointer}
.cliente-pill.on{color:var(--text)}
.pago{display:flex;background:var(--surface-container);border-radius:999px;overflow:hidden}
.pago button{border:0;padding:11px 12px;font-size:12px;font-weight:800;background:transparent;color:var(--muted);cursor:pointer}
.pago button.on{background:var(--primary);color:#fff}
.facturar{position:fixed;bottom:66px;left:50%;transform:translateX(-50%);width:calc(100% - 28px);max-width:402px;height:54px;border:0;border-radius:999px;background:var(--primary);color:#fff;font-size:17px;font-weight:800;display:flex;align-items:center;justify-content:center;gap:10px;box-shadow:0 8px 24px rgba(20,86,74,.35);cursor:pointer;z-index:30}
.facturar:disabled{background:#DDE5E1;color:#9AA8A2;box-shadow:none}
.nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:430px;background:#fff;border-top:1px solid #EDF1EE;display:flex;z-index:30;padding:6px 0 12px}
.nav button{flex:1;border:0;background:transparent;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11px;color:var(--muted);font-weight:600;cursor:pointer}
.nav .pill{height:30px;padding:0 18px;border-radius:999px;display:flex;align-items:center;justify-content:center;font-size:16px}
.nav button.on .pill{background:var(--primary-soft)}
.nav button.on{color:var(--primary);font-weight:800}
.toast{position:fixed;top:18px;left:50%;transform:translateX(-50%) translateY(-90px);background:var(--primary);color:#fff;padding:11px 18px;border-radius:999px;font-weight:700;font-size:14px;transition:transform .3s;z-index:99;box-shadow:0 8px 24px rgba(0,0,0,.25);white-space:nowrap}
.toast.show{transform:translateX(-50%) translateY(0)}
</style>
</head>
<body>
<div class="app">
  <header>
    <button class="back">←</button>
    <div class="titles"><h1>Nueva venta</h1><p>Prototipo visual · no guarda datos</p></div>
    <button class="hicon" title="Guardar en pausa">⏸</button>
    <button class="hicon" title="Tickets en pausa">🗄<span class="badge">2</span></button>
  </header>

  <div class="sorteos">
    <button class="sorteo" onclick="sorteo(this)">Mañana</button>
    <button class="sorteo" onclick="sorteo(this)">Tarde</button>
    <button class="sorteo on" onclick="sorteo(this)">Noche <span class="dot"></span></button>
  </div>

  <div class="jugadas" id="jugadas"></div>

  <div class="hot-label"><span>⚡ Tus más vendidos hoy</span><span>1 toque = adentro</span></div>
  <div class="hot" id="hot"></div>

  <div class="display" id="display"></div>

  <div class="ticket">
    <div class="ticket-head"><span id="ticketCount">0 jugada(s)</span><span>Ticket en vivo</span></div>
    <div class="ticket-body" id="ticketBody"></div>
    <div class="ticket-foot"><span>TOTAL</span><span id="ticketTotal">L 0.00</span></div>
  </div>

  <div class="amounts" id="amounts"></div>

  <div class="pad">
    <button class="key" onclick="tecla('1')">1</button><button class="key" onclick="tecla('2')">2</button><button class="key" onclick="tecla('3')">3</button>
    <button class="key" onclick="tecla('4')">4</button><button class="key" onclick="tecla('5')">5</button><button class="key" onclick="tecla('6')">6</button>
    <button class="key" onclick="tecla('7')">7</button><button class="key" onclick="tecla('8')">8</button><button class="key" onclick="tecla('9')">9</button>
    <button class="key danger fn" onclick="borrar()">C</button><button class="key" onclick="tecla('0')">0</button><button class="key fn" onclick="retro()">⌫</button>
  </div>

  <div class="cliente-row">
    <button class="cliente-pill" id="clientePill" onclick="toggleCliente()"></button>
    <div class="pago" id="pagoSeg" style="display:none">
      <button id="pagoContado" onclick="pago='contado';render()">Contado</button>
      <button id="pagoCredito" onclick="pago='credito';render()">Crédito</button>
    </div>
  </div>

  <button class="facturar" id="facturar" onclick="facturar()"></button>

  <div class="nav">
    <button><span class="pill">🏠</span>Inicio</button>
    <button class="on"><span class="pill">＋</span>Vender</button>
    <button><span class="pill">👥</span>Clientes</button>
    <button><span class="pill">⋯</span>Más</button>
  </div>
</div>
<div class="toast" id="toast"></div>

<script>
const NOMBRES=['Avión','Pies','Mujer','Muerto','Tigre','Embarazada','Elefante','Navaja','Conejo','Hombre','Anillo','Perro','Caballo','Gato','Boda','Ratón','Niña','Joven','Ángel','Mariposa','Espejo','Pájaro','Ataúd','Mono','Sapo','Balanza','Bandera','Juego','Gallo','Padre','Bolo','Alacrán','Culebra','Carpintero','Música','Virgen','Viejita','Suerte','Pistola','Jabón','Cielo','Novia','Madre','Pantera','Mesas','Iglesia','Familia','Banco','Estrella','Sombra','Luna Nueva','Policía','Zorrillo','Llanta','Licor','Olas','Árbol','Cuchillo','Venado','Selva','Dragón','Guerra','Lagarto','Coco','Mueble','Pintura','Diablo','Vaca','Ladrón','Soldado','Oro','Zapatos','Arco','Fuego','Edificio','Reina','Palomas','Humo','Tienda','Flores','Café','Rieles','Escuela','Bote','Corona','Casa','Reloj','León','Platos','Búho','Lentes','Tortuga','Águila','Cartero','Carro','Costurera','Dinero','Viejito','Bailes','Aretes'];
const JUGADAS=[
  {id:'diaria',label:'La Diaria',req:1,precio:null},
  {id:'pega3',label:'Pega 3',req:3,precio:10},
  {id:'loto',label:'Loto',req:6,precio:10},
  {id:'bingo',label:'Bingo',req:5,precio:20}
];
const HOT=['11','34','94','91','76'];
let mode=JUGADAS[0], cur='', sel=[], numFijo='', ticket=[], clienteOn=false, pago='contado';
const $=s=>document.querySelector(s);
const nombre=n=>NOMBRES[parseInt(n,10)]||'';
const formatL=n=>'L '+n.toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2});
const total=()=>ticket.reduce((s,t)=>s+t.precio,0);

function commit(n){
  if(mode.req===1){ numFijo=n; }
  else { sel.push(n); if(sel.length>=mode.req){ ticket.push({nums:sel.slice(),precio:mode.precio}); sel=[]; } }
}
function tecla(d){ cur+=d; if(cur.length===2){ commit(cur); cur=''; } render(); }
function retro(){ if(cur) cur=cur.slice(0,-1); else if(mode.req===1) numFijo=''; else sel.pop(); render(); }
function borrar(){ cur=''; sel=[]; numFijo=''; render(); }
function hot(n){ commit(n); render(); }
function ponMonto(v){ if(numFijo){ ticket.push({nums:[numFijo],precio:v}); numFijo=''; render(); } }
function ponOtro(){ const v=parseFloat(($('#otro')||{}).value); if(numFijo&&v>0){ ticket.push({nums:[numFijo],precio:v}); numFijo=''; render(); } }
function quitar(i){ ticket.splice(i,1); render(); }
function cambiarJugada(id){ mode=JUGADAS.find(j=>j.id===id); cur=''; sel=[]; numFijo=''; pintJugadas(); render(); }
function sorteo(b){ document.querySelectorAll('.sorteo').forEach(x=>x.classList.remove('on')); b.classList.add('on'); }
function toggleCliente(){ clienteOn=!clienteOn; render(); }
function facturar(){ if(!ticket.length) return; toast('✓ Facturado '+formatL(total())+' · ticket demo'); ticket=[]; numFijo=''; sel=[]; cur=''; render(); }
function toast(m){ const t=$('#toast'); t.textContent=m; t.classList.add('show'); setTimeout(()=>t.classList.remove('show'),1900); }

function pintJugadas(){
  $('#jugadas').innerHTML=JUGADAS.map(j=>`<button class="chip-j ${j.id===mode.id?'on':''}" onclick="cambiarJugada('${j.id}')">${j.label}${j.precio?' · '+formatL(j.precio):''}</button>`).join('');
  $('#hot').innerHTML=HOT.map(n=>`<button class="chip-hot" onclick="hot('${n}')">${n}<small>${nombre(n)}</small></button>`).join('');
}
function render(){
  const d=$('#display');
  if(mode.req===1){
    d.innerHTML=`<div class="num-big">${numFijo||cur||'––'}</div>
      <div class="disp-info"><div class="disp-name">${numFijo?numFijo+' '+nombre(numFijo):(cur?'escribiendo…':'Toca un número caliente o usa el teclado')}</div>
      <div class="disp-sub">La Diaria · elige el monto abajo y queda en el ticket</div></div>`;
  }else{
    const toks=[...sel,(cur||'')].filter(Boolean).map(t=>`<span class="token">${t} ${nombre(t)}</span>`).join('');
    d.innerHTML=`<div class="disp-info"><div class="tokens">${toks||'<span class="disp-name">Selecciona '+mode.req+' números</span>'}</div>
      <div class="disp-sub">${mode.label} · precio fijo ${formatL(mode.precio)} · ${sel.length}/${mode.req} · se agrega solo al completar</div></div>`;
  }
  $('#ticketBody').innerHTML = ticket.length
    ? ticket.map((t,i)=>`<div class="trow"><span class="tnum">${t.nums.map(n=>n+' '+nombre(n)).join(', ')}</span><span class="tpre">${formatL(t.precio)}</span><button class="tx" onclick="quitar(${i})">×</button></div>`).join('')
    : '<div class="empty">El ticket aparecerá aquí, idéntico al recibo impreso.</div>';
  $('#ticketCount').textContent=ticket.length+' jugada(s)';
  $('#ticketTotal').textContent=formatL(total());
  $('#amounts').innerHTML = mode.req===1
    ? [10,20,50,80,100].map(v=>`<button class="amt ${numFijo?'':'off'}" onclick="ponMonto(${v})">L ${v}</button>`).join('')
      + `<input id="otro" class="otro" type="number" placeholder="Otro" inputmode="numeric"><button class="amt ${numFijo?'':'off'}" onclick="ponOtro()">OK</button>`
    : `<span style="font-size:12px;color:var(--muted);font-weight:600">Precio fijo ${formatL(mode.precio)} — al completar ${mode.req} números se agrega solo al ticket.</span>`;
  const f=$('#facturar'); f.disabled=!ticket.length; f.textContent='🎫 FACTURAR · '+formatL(total());
  const p=$('#clientePill'); p.className='cliente-pill'+(clienteOn?' on':'');
  p.innerHTML=(clienteOn?'👤 Ezequiel':'👤 Cliente (opcional)')+`<span style="margin-left:auto;font-size:11px;color:var(--muted)">${clienteOn?pago:'toca para elegir'}</span>`;
  $('#pagoSeg').style.display=clienteOn?'flex':'none';
  $('#pagoContado').className=pago==='contado'?'on':'';
  $('#pagoCredito').className=pago==='credito'?'on':'';
}
pintJugadas(); render();
</script>
</body>
</html>
