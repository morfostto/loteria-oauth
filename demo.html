<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Demo v7 · Historial de pagos</title>
<style>
:root{--verde:#1a4a3a;--verde2:#14564a;--fondo:#f2f5f7}
*{box-sizing:border-box;font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--fondo);color:#111}
header{background:var(--verde);color:#fff;padding:14px 16px;display:flex;align-items:center;gap:10px;position:sticky;top:0;z-index:10}
.back{width:38px;height:38px;border-radius:50%;background:#fff;color:var(--verde);display:flex;align-items:center;justify-content:center;font-size:18px;border:0}
header h1{font-size:17px;margin:0;flex:1}
.av{width:38px;height:38px;border-radius:50%;background:#e8f3ee;color:var(--verde);font-weight:800;display:flex;align-items:center;justify-content:center}
.card{background:#fff;margin:10px 12px;border-radius:16px;padding:14px;box-shadow:0 1px 4px rgba(0,0,0,.06)}
.card h2{font-size:11px;margin:0 0 10px;text-transform:uppercase;letter-spacing:.5px;color:#8a94a0}
.big{background:#fdecec;border-radius:14px;padding:12px;text-align:center;margin-bottom:8px}
.big.ok{background:#e8f3ee}
.big p{margin:0;font-size:26px;font-weight:800;color:#c0392b}
.big.ok p{color:var(--verde2)}
.big small{color:#8a94a0;font-weight:700;font-size:10px;text-transform:uppercase}
.res{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.mini{background:#f2f5f7;border-radius:12px;padding:10px}
.mini small{display:block;color:#8a94a0;font-size:10px;font-weight:700;text-transform:uppercase}
.mini b{font-size:13px}
.row input{width:100%;border:1px solid #d7dce2;border-radius:12px;padding:12px;font-size:15px}
.btn{width:100%;border:0;background:var(--verde);color:#fff;border-radius:14px;padding:14px;font-weight:800;font-size:14px;margin-top:8px}
.listaScroll{max-height:216px;overflow-y:auto}
.pay{display:flex;align-items:center;gap:10px;background:#f2f5f7;border-radius:14px;padding:12px;margin-bottom:8px}
.pay .d{flex:1}
.pay .d b{font-size:14px}
.pay .d small{display:block;color:#8a94a0;font-size:11px}
.pay .m{font-weight:800;color:var(--verde2);font-size:15px}
.totalRow{display:flex;justify-content:space-between;align-items:center;background:#e8f3ee;border-radius:12px;padding:12px;margin-bottom:8px}
.totalRow small{color:#8a94a0;font-weight:700;font-size:10px;text-transform:uppercase}
.totalRow b{color:var(--verde2);font-size:18px}
#toast{position:fixed;left:50%;bottom:30px;transform:translateX(-50%);background:#14564a;color:#fff;padding:10px 18px;border-radius:99px;font-size:13px;opacity:0;transition:opacity .3s;pointer-events:none;z-index:60}
</style>
</head>
<body>
<header><button class="back">←</button><h1>Historial de pagos</h1><div class="av">E</div></header>

<div class="card">
<h2>Elvia · resumen</h2>
<div class="big" id="saldoBox"><small>Saldo pendiente</small><p id="saldo">L 300.00</p></div>
<div class="res">
<div class="mini"><small>Último pago</small><b id="ultimo">—</b></div>
<div class="mini"><small>Total pagado</small><b id="totalPagado">—</b></div>
</div>
</div>

<div class="card">
<h2>Registrar pago</h2>
<div class="row"><input id="monto" type="number" placeholder="Monto del pago (L)"></div>
<button class="btn" id="registrar">+ Registrar pago</button>
</div>

<div class="card">
<h2>Pagos realizados · más reciente primero</h2>
<div class="listaScroll" id="lista"></div>
</div>

<div class="card">
<h2>Premios ganados</h2>
<div class="totalRow"><small>Total premios ganados</small><b id="totPremios">L 0</b></div>
<div id="premios"></div>
</div>

<div id="toast"></div>
<script>
let saldo=300;
let pagos=[
 {f:'14/08/2026',h:'7:00 PM',m:300,s:300},
 {f:'27/07/2026',h:'6:00 PM',m:200,s:600},
 {f:'14/07/2026',h:'4:00 PM',m:300,s:800},
 {f:'02/07/2026',h:'5:00 PM',m:200,s:1000},
 {f:'20/06/2026',h:'6:00 PM',m:500,s:1200},
 {f:'05/06/2026',h:'4:00 PM',m:300,s:1500}
];
const premios=[
 {n:'Nº 86 Rieles',f:'13/08',m:3250},
 {n:'Nº 12 Gallo',f:'02/08',m:7000},
 {n:'Nº 45 Burro',f:'19/07',m:9750}
];
const $=id=>document.getElementById(id);
function toast(m){const t=$('toast');t.textContent=m;t.style.opacity=1;setTimeout(()=>t.style.opacity=0,1800);}
function pintar(){
 $('saldo').textContent='L '+saldo.toFixed(2);
 $('saldoBox').classList.toggle('ok',saldo<=0);
 $('totalPagado').textContent='L '+pagos.reduce((a,p)=>a+p.m,0).toLocaleString();
 $('ultimo').textContent=pagos.length?('L '+pagos[0].m+' · '+pagos[0].f.slice(0,5)+' '+pagos[0].h):'—';
 const l=$('lista');l.innerHTML='';
 pagos.forEach(p=>{
  const d=document.createElement('div');
  d.className='pay';
  d.innerHTML='<div class="d"><b>'+p.f+' · '+p.h+'</b><small>Quedó debiendo: L '+p.s+'</small></div><div class="m">+L '+p.m+'</div>';
  l.appendChild(d);
 });
 $('totPremios').textContent='L '+premios.reduce((a,p)=>a+p.m,0).toLocaleString();
 const pr=$('premios');pr.innerHTML='';
 premios.forEach(p=>{
  const d=document.createElement('div');
  d.className='pay';
  d.innerHTML='<div class="d"><b>'+p.n+'</b><small>'+p.f+' · premio pagado</small></div><div class="m">L '+p.m.toLocaleString()+'</div>';
  pr.appendChild(d);
 });
}
$('registrar').onclick=()=>{
 const m=parseFloat($('monto').value);
 if(!m||m<=0){toast('Escribe un monto');return;}
 saldo=Math.max(0,saldo-m);
 const a=new Date();
 const f=String(a.getDate()).padStart(2,'0')+'/'+String(a.getMonth()+1).padStart(2,'0')+'/'+a.getFullYear();
 const h=a.toLocaleTimeString('en-US',{hour:'numeric',minute:'2-digit'});
 pagos.unshift({f,h,m,s:saldo});
 $('monto').value='';
 pintar();
 toast('Pago registrado: L '+m+' ✓');
};
pintar();
</script>
</body>
</html>
